<svg xmlns="http://www.w3.org/2000/svg" width="320" height="400" viewBox="0 0 320 400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d1c2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5c2a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1520;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#c4547a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#c4547a;stop-opacity:0" />
    </radialGradient>
