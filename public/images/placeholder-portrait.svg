  <rect width="320" height="400" fill="url(#bg1)" />
  <rect width="320" height="400" fill="url(#glow1)" />
  <text x="160" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c4a882" opacity="0.6">♡</text>
  <text x="160" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c4a882" opacity="0.4">Portrait Photo</text>
